name: Release 3.4.1 Bootstrap

on:
  push:
    branches:
      - release/3.4.1

permissions:
  contents: write

jobs:
  publish:
    name: build validated 3.4.1 release commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply 3.4.1 release promotion
        run: python tools/bootstrap-release-3-4-1.py

      - name: Validate formal release gate
        run: npm run release:3.4.1

      - name: Check whitespace integrity
        run: git diff --check

      - name: Commit final release snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/release-3-4-1-bootstrap.yml tools/bootstrap-release-3-4-1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add docs/RELEASE-3.4.1.md docs/releases/evidence/v3.4.1/summary.md tools/release-3-4-1-check.py
          git diff --cached --check
          git commit -m "release: publish 3.4.1"
          git push origin HEAD:release/3.4.1
