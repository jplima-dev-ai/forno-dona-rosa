name: Export 3.4.1 Working State

on:
  push:
    branches:
      - release/3.4.1-performance

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Create clean project archive
        shell: python
        run: |
          from pathlib import Path
          import zipfile

          root = Path.cwd()
          out = root / "FornoDonaRosa_v3.4.1_CURRENT_WORKING_STATE.zip"
          excluded_dirs = {".git", "node_modules", "artifacts", "test-results", "playwright-report", "__pycache__"}
          excluded_files = {".github/workflows/export-3-4-1.yml", out.name}

          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue
                  rel = path.relative_to(root)
                  if any(part in excluded_dirs for part in rel.parts):
                      continue
                  if rel.as_posix() in excluded_files:
                      continue
                  zf.write(path, Path("FornoDonaRosa_v3.4.1_CURRENT_WORKING_STATE") / rel)

          print(f"Created {out.name}: {out.stat().st_size} bytes")

      - name: Upload clean project archive
        uses: actions/upload-artifact@v4
        with:
          name: FornoDonaRosa_v3.4.1_CURRENT_WORKING_STATE
          path: FornoDonaRosa_v3.4.1_CURRENT_WORKING_STATE.zip
          if-no-files-found: error
          retention-days: 7
