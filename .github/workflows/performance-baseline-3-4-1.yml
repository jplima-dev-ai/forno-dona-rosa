name: Performance Baseline 3.4.1

on:
  push:
    branches:
      - release/3.4.1-clean
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lighthouse-baseline:
    name: lighthouse baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Build site
        run: npm run build

      - name: Start local site
        shell: bash
        run: |
          python -m http.server 4173 > /tmp/forno-http.log 2>&1 &
          echo $! > /tmp/forno-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/forno-http.log
          exit 1

      - name: Prepare Lighthouse output directory
        run: mkdir -p artifacts/lighthouse

      - name: Run mobile Lighthouse baseline
        run: >-
          npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/
          --quiet
          --chrome-flags="--headless --no-sandbox"
          --output=json
          --output=html
          --output-path=artifacts/lighthouse/mobile

      - name: Run desktop Lighthouse baseline
        run: >-
          npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/
          --quiet
          --preset=desktop
          --chrome-flags="--headless --no-sandbox"
          --output=json
          --output=html
          --output-path=artifacts/lighthouse/desktop

      - name: Summarize baseline metrics
        shell: python
        run: |
          import json
          from pathlib import Path

          def read(label, path):
              report = json.loads(Path(path).read_text(encoding='utf-8'))
              audits = report['audits']
              categories = report['categories']
              return {
                  'profile': label,
                  'performance': round(categories['performance']['score'] * 100),
                  'fcp_ms': round(audits['first-contentful-paint']['numericValue'], 1),
                  'lcp_ms': round(audits['largest-contentful-paint']['numericValue'], 1),
                  'tbt_ms': round(audits['total-blocking-time']['numericValue'], 1),
                  'cls': round(audits['cumulative-layout-shift']['numericValue'], 4),
                  'speed_index_ms': round(audits['speed-index']['numericValue'], 1),
              }

          rows = [
              read('mobile', 'artifacts/lighthouse/mobile.report.json'),
              read('desktop', 'artifacts/lighthouse/desktop.report.json'),
          ]

          print('PERFORMANCE_BASELINE_3_4_1=' + json.dumps(rows, separators=(',', ':')))
          summary = Path('performance-baseline.md')
          lines = [
              '# Performance Baseline 3.4.1',
              '',
              '| Profile | Performance | FCP ms | LCP ms | TBT ms | CLS | Speed Index ms |',
              '| --- | ---: | ---: | ---: | ---: | ---: | ---: |',
          ]
          for row in rows:
              lines.append(
                  f"| {row['profile']} | {row['performance']} | {row['fcp_ms']} | {row['lcp_ms']} | "
                  f"{row['tbt_ms']} | {row['cls']} | {row['speed_index_ms']} |"
              )
          summary.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as handle:
              handle.write(summary.read_text(encoding='utf-8'))

      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline-3.4.1-${{ github.sha }}
          path: |
            artifacts/lighthouse/
            performance-baseline.md
          if-no-files-found: warn
          retention-days: 14
