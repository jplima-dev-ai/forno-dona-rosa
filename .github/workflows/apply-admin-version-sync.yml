name: Apply Admin Version Sync
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'release/3.4.1-performance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Wire sync into build and update Admin
        shell: python
        run: |
          from pathlib import Path
          import json
          p=Path('package.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          old=data['scripts']['build']
          sync='python tools/sync-admin-version.py'
          if sync not in old:
              data['scripts']['build']=old.replace('python tools/sync-runtime-menu.py', 'python tools/sync-runtime-menu.py && '+sync, 1)
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
      - name: Synchronize Admin version
        run: python tools/sync-admin-version.py
      - name: Retire one-shot workflow
        run: git rm .github/workflows/apply-admin-version-sync.yml
      - name: Commit patch
        run: |
          git config user.name "João Paulo"
          git config user.email "futuro.aprovado070@gmail.com"
          git add package.json admin/index.html tools/sync-admin-version.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(admin): synchronize Admin Studio version during build"
          git push origin HEAD:${{ github.head_ref }}
