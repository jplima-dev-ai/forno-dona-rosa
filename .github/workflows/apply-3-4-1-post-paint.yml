name: Apply 3.4.1 Post-Paint Hydration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'release/3.4.1-performance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.4.1-performance
          fetch-depth: 0
      - name: Convert home runtime to post-paint hydration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          index = root / 'index.html'
          html = index.read_text(encoding='utf-8')

          # Keep src paths visible for auditing while preventing initial fetch/execution.
          html = re.sub(
              r'<script\s+defer\s+src="((?:js|data)/[^\"]+)"\s*></script>',
              r'<script type="application/x-forno-deferred" src="\1"></script>',
              html,
              flags=re.I,
          )
          html = re.sub(
              r'<script\s+src="((?:js|data)/[^\"]+)"\s+defer\s*></script>',
              r'<script type="application/x-forno-deferred" src="\1"></script>',
              html,
              flags=re.I,
          )
          html = re.sub(
              r'<script\s+defer\s+src="(\./js/[^\"]+)"\s*></script>',
              r'<script type="application/x-forno-deferred" src="\1"></script>',
              html,
              flags=re.I,
          )
          html = re.sub(
              r'<script\s+src="(\./js/[^\"]+)"\s+defer\s*></script>',
              r'<script type="application/x-forno-deferred" src="\1"></script>',
              html,
              flags=re.I,
          )

          loader = '<script defer src="js/home-runtime-loader.js"></script>'
          if loader not in html:
              html = html.replace('</body></html>', loader + '\n</body></html>')
          index.write_text(html, encoding='utf-8')

          # Self-remove before commit.
          (root / '.github/workflows/apply-3-4-1-post-paint.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: hydrate home runtime after initial paint"
          git push origin release/3.4.1-performance
