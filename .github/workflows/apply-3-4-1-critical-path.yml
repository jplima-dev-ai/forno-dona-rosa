name: Apply 3.4.1 Critical Rendering Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'release/3.4.1-performance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.4.1-performance
          fetch-depth: 0
      - name: Optimize critical rendering path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          css_order = [
              'css/styles.css',
              'css/experience-v4.css',
              'css/brand-theme.css',
              'css/focal-position.css',
              'css/adaptive-commerce-v4.css',
              'css/visual-desire-v4.css',
              'css/resilience-v4.css',
              'css/premium-release-v4.css',
              'css/smart-pairing-v4-1-4.css',
              'css/intelligent-bag-v4-1-5.css',
              'css/accessibility-fortress-v4-1-8.css',
          ]

          # Build a single home stylesheet in the exact existing cascade order.
          bundle = ['/* Forno Dona Rosa 3.4.1 — home critical bundle. Generated from source CSS in cascade order. */']
          for rel in css_order:
              text = (root / rel).read_text(encoding='utf-8')
              bundle.append(f'\n/* source: {rel} */\n{text}\n')
          (root / 'css/home-bundle.css').write_text('\n'.join(bundle), encoding='utf-8')

          # Add a reproducible bundle builder for future edits.
          builder = root / 'tools/build-home-bundle.py'
          builder.write_text('''#!/usr/bin/env python3\nfrom pathlib import Path\nROOT=Path(__file__).resolve().parents[1]\nORDER=''' + repr(css_order) + '''\nparts=['/* Forno Dona Rosa 3.4.1 — home critical bundle. Generated; do not edit directly. */']\nfor rel in ORDER:\n    parts.append(f"\\n/* source: {rel} */\\n" + (ROOT/rel).read_text(encoding="utf-8") + "\\n")\n(ROOT/"css/home-bundle.css").write_text("\\n".join(parts),encoding="utf-8")\nprint(f"HOME CSS BUNDLE PASSED ({len(ORDER)} sources)")\n''', encoding='utf-8')

          index_path = root / 'index.html'
          html = index_path.read_text(encoding='utf-8')

          # Remove the 11 individual home CSS requests and insert one bundle at the first stylesheet position.
          first = '<link href="css/styles.css" rel="stylesheet"/>'
          if first in html:
              html = html.replace(first, '<link href="css/home-bundle.css" rel="stylesheet"/>', 1)
          css_patterns = [
              '<link href="css/experience-v4.css" rel="stylesheet"/>',
              '<link href="css/brand-theme.css" rel="stylesheet"/>',
              '<link href="css/focal-position.css" rel="stylesheet"/>',
              '<link href="css/adaptive-commerce-v4.css" rel="stylesheet"/>',
              '<link href="css/visual-desire-v4.css" rel="stylesheet"/>',
              '  <link rel="stylesheet" href="./css/resilience-v4.css">',
              '  <link rel="stylesheet" href="./css/premium-release-v4.css">',
              '<link rel="stylesheet" href="css/smart-pairing-v4-1-4.css">',
              '<link rel="stylesheet" href="css/intelligent-bag-v4-1-5.css">',
              '  <link rel="stylesheet" href="css/accessibility-fortress-v4-1-8.css">',
          ]
          for token in css_patterns:
              html = html.replace(token, '')

          # Remove no-longer-used Google font origins from home CSP.
          html = html.replace("style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;", "style-src 'self'; font-src 'self';")
          html = html.replace("connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://viacep.com.br", "connect-src 'self' https://viacep.com.br")

          # Defer every external local script; defer preserves document order and removes parser blocking.
          html = re.sub(r'<script(?![^>]*\bdefer\b)([^>]*\bsrc="(?:js|data)/[^\"]+"[^>]*)></script>', r'<script defer\1></script>', html, flags=re.I)
          html = re.sub(r'<script(?![^>]*\bdefer\b)([^>]*\bsrc="\./js/[^\"]+"[^>]*)></script>', r'<script defer\1></script>', html, flags=re.I)
          html = html.replace('Rosa Order Concierge 3.0 • v3.4.0', 'Rosa Order Concierge 3.0 • v3.4.1')
          index_path.write_text(html, encoding='utf-8')

          # Generated pages: defer ordered external scripts too.
          build_path = root / 'tools/build-site.py'
          build = build_path.read_text(encoding='utf-8')
          build = build.replace("return '\\n'.join(f'<script src=\"{p}{path}\"></script>' for path in ordered)", "return '\\n'.join(f'<script defer src=\"{p}{path}\"></script>' for path in ordered)")
          build_path.write_text(build, encoding='utf-8')

          # Ensure every normal build refreshes the bundle before page generation.
          pkg = root / 'package.json'
          import json
          data = json.loads(pkg.read_text(encoding='utf-8'))
          data['scripts']['build'] = 'python tools/sync-runtime-menu.py && npm run build:media && python tools/build-home-bundle.py && python tools/build-site.py'
          pkg.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Public documentation must identify the current branch version for docs gate.
          readme = root / 'README.md'
          r = readme.read_text(encoding='utf-8')
          r = r.replace('## Versão atual: 3.4.0', '## Versão atual: 3.4.1')
          r = r.replace('**Versão pública atual:** `3.4.0`', '**Versão pública atual:** `3.4.1`')
          r = r.replace('A versão pública do projeto permanece **3.4.0**', 'A versão pública corrente desta branch é **3.4.1**')
          readme.write_text(r, encoding='utf-8')

          # Self-remove before commit.
          (root / '.github/workflows/apply-3-4-1-critical-path.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: reduce 3.4.1 critical rendering path"
          git push origin release/3.4.1-performance
